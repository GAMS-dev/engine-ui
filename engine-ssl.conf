limit_req_zone $LIMIT_REQ_KEY zone=api:10m rate=5r/s;
limit_req zone=api burst=30 nodelay;
limit_req_status 429;

map $http_origin $cors_allowed_origin {
    default "";
    "~*$CORS_ALLOWED_ORIGIN_REGEX" $http_origin;
}

# HTML (e.g. index.html, served for every app route) isn't cached, so a deploy
# can't leave removed chunks referenced. Responses with their own
# Cache-Control keep it.
map "$sent_http_content_type|$sent_http_cache_control" $html_cache_control {
    "~^text/html[^|]*\|$" "no-store, max-age=0";
    default "";
}

server {
    listen $ENGINE_HTTP_PORT;
    listen [::]:$ENGINE_HTTP_PORT;

    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen $ENGINE_HTTPS_PORT ssl http2;
    listen [::]:$ENGINE_HTTPS_PORT ssl http2;

    ssl_certificate /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000 " always;
    add_header X-Frame-Options "DENY" always;

    location $mount_api_url { try_files $uri @app; }
    location @app {
        include uwsgi_params;
        uwsgi_max_temp_file_size 102400m;
        uwsgi_pass $uwsgi_pass_url;

        # No add_header here: nginx only inherits the server-level add_header
        # lines below when a location defines none of its own.
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    # Pages load it relative to their <base>, i.e. under the mount path.
    location ~ ^${mount_url}/?env-config\.js$ {
        alias /tmp/engine-ui-config/env-config.js;
        add_header Cache-Control 'no-store, max-age=0' always;
    }
    location $mount_url {
        alias $root_url/;
        sub_filter_once on;
        sub_filter '<head>' '<head><base href="$BASE_URL">';
        try_files $uri $mount_url/index.html;
    }
    add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()" always;
    add_header Content-Security-Policy "default-src 'self';script-src 'self' 'sha256-7znq/89hS4wzz2/DYmbizPP16RYMnUCUVak3lYPZl+c=';style-src 'self' 'unsafe-inline';img-src 'self' data:;connect-src 'self' https:;frame-ancestors 'none';form-action 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $html_cache_control always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin $cors_allowed_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Max-Age 1728000 always;
    add_header Vary Origin always;
    client_max_body_size 0;
    server_tokens off;
}
